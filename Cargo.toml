[workspace]
members = [
    "crates/wingpane-proto",
    "crates/wingpane-core",
    "apps/desktop/wingpaned",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Lam Nguyen <lamnt9@users.noreply.github.com>"]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1.0", features = ["alloc"] }
tokio = { version = "1.43", features = ["net", "io-util", "macros", "rt-multi-thread", "sync", "time", "signal", "process"] }
thiserror = "2.0"

